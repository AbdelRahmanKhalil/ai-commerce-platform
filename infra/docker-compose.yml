services:
  postgres:
    image: postgres:18.6
    restart: unless-stopped
    environment:
      POSTGRES_DB: aicommerce
      POSTGRES_USER: aicommerce
      POSTGRES_PASSWORD: ${DB_PASSWORD:-aicommerce}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      # Postgres 18's image stores data under a version-specific subdirectory of a
      # single /var/lib/postgresql mount (for pg_upgrade --link support) - mounting at
      # the old /var/lib/postgresql/data path (pre-18 convention) makes the image
      # refuse to start.
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aicommerce"]
      interval: 5s
      timeout: 5s
      retries: 10

  keycloak:
    image: quay.io/keycloak/keycloak:26.7.3
    restart: unless-stopped
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USERNAME:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
    ports:
      - "127.0.0.1:8081:8080"
    volumes:
      - ./keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json:ro

volumes:
  postgres-data:
