app:
  security:
    # Required audience on every JWT this API accepts - see AudienceValidator. The
    # Keycloak realm is shared across clients (ADR 003), so issuer validation alone
    # doesn't prove a token was minted for this API.
    expected-audience: aicommerce-api
  tenancy:
    # Deployment-configured reserved Store slugs (ADR 008): Store.slug is a real
    # routable DNS label under the hosted storefront's <slug>.<base-domain> scheme, so
    # these labels can never be assigned to a merchant Store. Overridable per
    # deployment via standard Spring Boot configuration (e.g.
    # APP_TENANCY_RESERVED-STORE-SLUGS env var) - see ReservedStoreSlugProperties.
    reserved-store-slugs:
      - www
      - api
      - app
      - admin

spring:
  application:
    name: ai-commerce-backend
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
  mvc:
    problemdetails:
      enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

logging:
  structured:
    format:
      console: ecs
