app:
  security:
    # Required audience on every JWT this API accepts - see AudienceValidator. The
    # Keycloak realm is shared across clients (ADR 003), so issuer validation alone
    # doesn't prove a token was minted for this API.
    expected-audience: aicommerce-api

spring:
  application:
    name: ai-commerce-backend
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
  mvc:
    problemdetails:
      enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

logging:
  structured:
    format:
      console: ecs
